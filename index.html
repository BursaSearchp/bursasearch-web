<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BursaSearch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Committed to one look, always — the app itself has no light mode, so
     letting this page flip with the visitor's OS theme just meant the
     accent silently became a duller, off-brand green in light mode. This
     is the app's actual palette (dashboard navy + teal), not a separate
     invented one. */
  :root {
    --bg: #091723;
    --surface: #0F2135;
    --text: #FFFFFF;
    --text-muted: #7A9BB5;
    --accent: #0F8A8A;
    --accent-strong: #1CC4BC;
    --ring: rgba(255,255,255,.08);
    --shadow: rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 64px 20px 40px;
  }

  .page {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    /* a distinctly lighter disc so the (transparent) mark reads cleanly,
       rather than a dark logo tile lost against the near-black surface. */
    background: #EEF4F4;
    box-shadow: 0 1px 2px var(--shadow), 0 0 0 1px var(--ring);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar svg {
    display: block;
    width: 52px;
    height: 52px;
    color: var(--accent);
  }

  .wordmark {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.4px;
  }
  .wordmark .bursa { color: var(--text); }
  .wordmark .search { color: var(--accent); }

  .tagline {
    margin-top: -12px;
    color: var(--text-muted);
    font-size: 15px;
    text-align: center;
  }

  .cta {
    width: 100%;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    background: var(--accent);
    color: #06110E;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 22px;
    border-radius: 12px;
  }
  .cta:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 3px;
  }

  .cta .play-glyph,
  .cta .apple-glyph {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  .foot {
    margin-top: 22px;
    color: var(--text-muted);
    font-size: 11.5px;
    text-align: center;
    opacity: .7;
  }
</style>
</head>
