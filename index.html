<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BursaSearch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF3F4;
    --surface: #FFFFFF;
    --text: #0A1626;
    --text-muted: #5B7285;
    --accent: #0D7A6B;
    --accent-strong: #0A5F53;
    --ring: rgba(10,22,38,.10);
    --shadow: rgba(10,22,38,.08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #060E19;
      --surface: #0E1D2E;
      --text: #FFFFFF;
      --text-muted: #9FB3C8;
      --accent: #14B8A6;
      --accent-strong: #1FD6C1;
      --ring: rgba(255,255,255,.10);
      --shadow: rgba(0,0,0,.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #060E19;
    --surface: #0E1D2E;
    --text: #FFFFFF;
    --text-muted: #9FB3C8;
    --accent: #14B8A6;
    --accent-strong: #1FD6C1;
    --ring: rgba(255,255,255,.10);
    --shadow: rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 64px 20px 40px;
  }

  .page {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: 0 1px 2px var(--shadow), 0 0 0 1px var(--ring);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .avatar img {
    width: 62%;
    height: 62%;
    object-fit: contain;
  }

  .wordmark {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.4px;
  }
  .wordmark .bursa { color: var(--text); }
  .wordmark .search { color: var(--accent); }

  .tagline {
    margin-top: -12px;
    color: var(--text-muted);
    font-size: 15px;
    text-align: center;
  }

  .cta {
    width: 100%;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    background: var(--accent);
    color: #06110E;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 22px;
    border-radius: 12px;
  }
  .cta:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 3px;
  }

  .cta .play-glyph,
  .cta .apple-glyph {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  .foot {
    margin-top: 22px;
    color: var(--text-muted);
    font-size: 11.5px;
    text-align: center;
    opacity: .7;
  }
</style>
</head>
